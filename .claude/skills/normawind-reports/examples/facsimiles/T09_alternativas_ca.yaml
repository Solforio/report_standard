  - id: alternatives
    blocks:
      - bullets: ["**Alternativa A:** traçat aeri per l'oest (autoritzat).", "**Alternativa B:** soterrat en paral·lel a la carretera (proposta).", "**Alternativa C:** soterrat per l'est."]
  - id: comparison
    blocks:
      - table:
          caption: "Comparativa d'alternatives"
          header: ["Criteri", "A", "B", "C"]
          rows: [["Afecció ambiental", "Mitjana", "Baixa", "Baixa"], ["Viabilitat tècnica", "Baixa", "Alta", "Mitjana"], ["Compatibilitat amb informes", "No", "Sí", "Parcial"], ["Cost relatiu", "100", "125", "140"], ["Termini", "Llarg", "Mitjà", "Llarg"]]
  - id: conclusions
    blocks:
      - callout: {kind: ok, title: "Recomanació:", text: "S'adopta l'**alternativa B**, que compleix els condicionants dels organismes amb un sobrecost del 25 %."}
