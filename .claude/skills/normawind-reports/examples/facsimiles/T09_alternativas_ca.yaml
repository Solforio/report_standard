    blocks:
      - table:
          caption: "Hitos del projecte autoritzat"
          header: ["Tràmit", "Data", "Estat"]
          rows: [["DIA favorable", "01/2023", "Obtinguda"], ["Autorització administrativa prèvia", "07/2023", "Obtinguda"], ["Autorització administrativa de construcció", "07/2024", "Obtinguda"]]
      - p: "El traçat autoritzat és aeri per l'oest de la carretera fins al suport 70, on passa a soterrat fins a la subestació."
  - id: justification
    blocks:
      - p: "Els informes rebuts dels organismes afectats obliguen a modificar el traçat:"
      - bullets:
          - "**Carreteres de l'Estat:** informe desfavorable al tram final per afecció a un projecte de variant."
          - "**Diputació:** la rasa s'ha de situar a un mínim de 3 m de l'aresta exterior de l'esplanació."
          - "**Ministeri de Transports:** cal consultar l'afecció a la línia ferroviària."
  - id: proposal
    blocks:
      - p: "Es proposa soterrar la línia a partir del suport 61, en paral·lel a la carretera comarcal, i creuar l'autopista engrapada al pont existent."
