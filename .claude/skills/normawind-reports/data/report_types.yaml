# Tipos de informe NORMAWIND: estructura estándar de secciones y formatos recomendados.
# `primary`: formato principal recomendado. `formats`: los que tienen sentido. `style`: "document" (A4) o "deck" (16:9).
# `sections`: orden estándar; las marcadas con * son obligatorias. Una sección puede omitirse si no aplica.
# Antecedentes históricos en el vault: NORMAWIND_Vault/Report Standardization/02_Tipos_de_informe/.

posicionamiento_viabilidad:
  primary: pptx
  formats: [pptx, pdf, docx, html]
  style: deck
  sections: [executive_summary*, objective*, scope, regulatory_framework, methodology, site_description*, site_analysis*, wind_resource, technical_proposal*, alternatives, energy_analysis, economic_analysis, conclusions*, next_steps*, annexes]
